<title id="title">Hung’s shared agent setup</title>
<desc id="description">Shared botfile and sync-mcp configuration feeds Codex, Claude, Gemini, and Pi, which use code graphs, documentation, and Fusion. Obsidian holds knowledge and Notion holds tasks. Cognee, Mem0, and ACPX remain experimental.</desc>

