<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title description">
<title id="title">Hung’s shared agent setup</title>
<desc id="description">Shared botfile and sync-mcp configuration feeds Codex, Claude, Gemini, and Pi, which use code graphs, documentation, and Fusion. Obsidian holds knowledge and Notion holds tasks. Cognee, Mem0, and ACPX remain experimental. A single signal follows the main route once over three seconds.</desc>
<style>.signal{animation:route 3s cubic-bezier(.25,.65,.35,1) 1 forwards}@keyframes route{to{transform:translateX(551px)}}@media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}</style>
